name: Verify RUN-AI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: run-ai-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Regression tests for Browser AI and Bedrock conversation history
        run: npm test
      - name: Type-check Amplify backend
        run: npm run check
      - name: Build Vite frontend
        run: npm run build
